<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Die Reihenfolge der biblischen Bücher</title>
<style>
  :root{
    --paper: #EFEAE0;
    --paper-2: #E5DECD;
    --ink: #1E2A38;
    --ink-soft: #4A5A6A;
    --gold: #A9812E;
    --gold-soft: #D8C48F;
    --green: #4B6C4E;
    --green-soft: #CFE0CE;
    --red: #8B3A3A;
    --red-soft: #E7CFC9;
    --rule: #C9C0AC;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:20px 14px 40px;
  }
  .app{width:100%;max-width:440px;}

  header{text-align:center;margin-bottom:18px;}
  header .title{
    font-family:var(--serif);
    font-size:26px;
    line-height:1.25;
    letter-spacing:0.2px;
    color:var(--ink);
  }

  .shelfGroup{margin-bottom:10px;}
  .masteryLine{font-family:var(--serif);font-size:14px;color:var(--ink);text-align:center;margin:0 0 8px;}
.recentGreen{font-size:11px;color:var(--ink-soft);text-align:center;margin:-2px 0 12px;min-height:15px;}
.shelf .spine.catStart{margin-left:5px;}
.historyMode{font-size:11.5px;color:var(--gold);margin:-8px 0 12px;}
.chapterInput{font-family:var(--sans);font-size:16px;padding:12px;text-align:center;border:1px solid var(--rule);border-radius:5px;background:var(--paper);color:var(--ink);width:100%;}
.chapterHint{font-size:12px;color:var(--ink-soft);text-align:center;margin:0 0 10px;}
.shelfLabel{
    font-size:10px;
    color:var(--ink-soft);
    letter-spacing:0.3px;
    margin-bottom:5px;
  }
  .shelf{
    display:flex;
    flex-wrap:wrap;
    gap:7px 3px;
    padding:10px;
    background:var(--paper-2);
    border-radius:4px;
  }
  .spine{
    width:5.2px;
    height:26px;
    border-radius:1px;
    background:#B9AF98;
    transition:background 0.4s ease, transform 0.2s ease;
  }
  .spine.green{background:var(--green);}
  .spine.mid{background:#B9AF98;}
  .spine.red{background:var(--red);}
  .spine.pulse{transform:scaleY(1.15);}
  .legend{
    display:flex;
    gap:14px;
    justify-content:center;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.green{background:var(--green);}
  .dot.mid{background:#B9AF98;}
  .dot.red{background:var(--red);}

  .testBar{display:flex;justify-content:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  button.testStart{
    font-family:var(--sans);
    font-size:12.5px;
    padding:8px 14px;
    background:transparent;
    color:var(--gold);
    border:1px solid var(--gold);
    border-radius:20px;
    cursor:pointer;
  }
  .settingsPanel{
    background:#fff;
    border:1px solid var(--rule);
    border-radius:6px;
    padding:6px 16px;
    margin-bottom:14px;
  }
  .settingsRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--paper-2);
    font-size:14px;
    font-family:var(--sans);
  }
  .settingsRow:last-child{border-bottom:none;}
  .toggle{
    width:38px;height:22px;border-radius:12px;
    background:var(--rule);
    position:relative;cursor:pointer;
    transition:background 0.2s ease;
    flex-shrink:0;
  }
  .toggle.on{background:var(--green);}
  .toggle::after{
    content:'';position:absolute;top:2px;left:2px;
    width:18px;height:18px;border-radius:50%;
    background:#fff;transition:left 0.2s ease;
  }
  .toggle.on::after{left:18px;}

  .card{
    background:#fff;
    border:1px solid var(--rule);
    border-radius:6px;
    padding:24px 20px;
    min-height:230px;
    display:flex;
    flex-direction:column;
  }
  .testHeader{
    font-family:var(--sans);
    font-size:11.5px;
    letter-spacing:0.3px;
    color:var(--gold);
    margin-bottom:8px;
  }
  .qtype{
    font-family:var(--serif);
    font-style:italic;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .qtext{
    font-family:var(--serif);
    font-size:19px;
    line-height:1.4;
    margin-bottom:18px;
  }

  .options{display:flex;flex-direction:column;gap:10px;flex:1;}
  .pairRow{display:flex;gap:10px;}
  .pairRow .opt{flex:1;}

  .opt{
    font-family:var(--sans);
    font-size:15.5px;
    padding:14px 12px;
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:5px;
    text-align:center;
    cursor:pointer;
    color:var(--ink);
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .opt:active{background:var(--paper-2);}
  .opt.correct{background:var(--green-soft);border-color:var(--green);}
  .opt.wrong{background:var(--red-soft);border-color:var(--red);}
  .opt.disabled{pointer-events:none;opacity:0.55;}

  .seqLine{
    font-family:var(--serif);
    font-size:16.5px;
    line-height:2.1;
    text-align:center;
    margin-bottom:16px;
    color:var(--ink-soft);
  }
  .seqLine .blank{
    display:inline-block;
    min-width:70px;
    border-bottom:2px solid var(--gold);
    color:var(--ink);
    font-weight:bold;
  }
  .seqLine .known{color:var(--ink);}

  .chipsRow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .chip{
    font-family:var(--sans);
    font-size:14px;
    padding:9px 12px;
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:16px;
    cursor:pointer;
  }
  .chip.used{opacity:0.35;pointer-events:none;}
  .answerSlots{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:14px;
    min-height:40px;
  }
  .slot{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--serif);
    font-size:15px;
    padding:8px 10px;
    border-bottom:1px dashed var(--rule);
  }
  .slot .n{color:var(--gold);font-weight:bold;width:18px;}
  .slot.correct{color:var(--green);}
  .slot.wrong{color:var(--red);}

  .actionRow{display:flex;gap:10px;margin-top:20px;}
  button.primary{
    font-family:var(--sans);
    font-size:14.5px;
    font-weight:600;
    padding:12px 16px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:5px;
    cursor:pointer;
    flex:1;
  }
  button.primary:disabled{opacity:0.4;}
  button.ghost{
    font-family:var(--sans);
    font-size:13px;
    padding:10px 12px;
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--rule);
    border-radius:5px;
    cursor:pointer;
  }

  .feedback{
    font-family:var(--serif);
    font-size:14.5px;
    margin-bottom:10px;
    min-height:20px;
  }
  .feedback.good{color:var(--green);}
  .feedback.bad{color:var(--red);}

  .summaryScore{font-family:var(--serif);font-size:40px;text-align:center;margin:18px 0 8px;}
  .summaryLine{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:20px;}

  footer{
    margin-top:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  footer .resetLink{
    background:none;border:none;color:var(--ink-soft);
    text-decoration:underline;cursor:pointer;font-size:12px;font-family:var(--sans);
    padding:0;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">Die Reihenfolge der biblischen Bücher</div>
  </header>

  <div class="masteryLine" id="masteryLine">Sicher beherrscht: 0 / 66 Bücher</div>
  <div class="recentGreen" id="recentGreen"></div>

  <div class="shelfGroup">
    <div class="shelfLabel">Altes Testament</div>
    <div class="shelf" id="shelfAT"></div>
  </div>
  <div class="shelfGroup">
    <div class="shelfLabel">Neues Testament</div>
    <div class="shelf" id="shelfNT"></div>
  </div>
  <div class="legend">
    <span><span class="dot mid"></span>offen</span>
    <span><span class="dot green"></span>sicher</span>
    <span><span class="dot red"></span>schwach</span>
  </div>
  <div class="testBar">
    <button class="testStart" id="testBtn">Kurztest starten (10 Fragen)</button>
    <button class="testStart" id="settingsBtn">Fragetypen</button>
  </div>
  <div class="settingsPanel" id="settingsPanel" style="display:none;"></div>

  <div class="card" id="card"></div>

  <footer>
    <span id="statLine">Serie: 0 · Richtig: 0/0</span>
    <button class="resetLink" id="resetBtn">Fortschritt zurücksetzen</button>
  </footer>
  <div id="storageStatus" style="font-size:10.5px;color:var(--ink-soft);text-align:center;margin-top:8px;">Speicherstatus wird geprüft …</div>
</div>

<script>
const BOOKS = [
"1. Mose","2. Mose","3. Mose","4. Mose","5. Mose","Josua","Richter","Rut",
"1. Samuel","2. Samuel","1. Könige","2. Könige","1. Chronik","2. Chronik",
"Esra","Nehemia","Ester","Hiob","Psalmen","Sprüche","Prediger","Hoheslied",
"Jesaja","Jeremia","Klagelieder","Hesekiel","Daniel","Hosea","Joel","Amos",
"Obadja","Jona","Micha","Nahum","Habakuk","Zefanja","Haggai","Sacharja","Maleachi",
"Matthäus","Markus","Lukas","Johannes","Apostelgeschichte","Römer",
"1. Korinther","2. Korinther","Galater","Epheser","Philipper","Kolosser",
"1. Thessalonicher","2. Thessalonicher","1. Timotheus","2. Timotheus","Titus",
"Philemon","Hebräer","Jakobus","1. Petrus","2. Petrus","1. Johannes",
"2. Johannes","3. Johannes","Judas","Offenbarung"
];
const N = BOOKS.length; // 66

const FAMILIES = [
  {ids:[0,1,2,3,4], label:"Mose-Bücher"},
  {ids:[5], label:"Josua"}, {ids:[6], label:"Richter"}, {ids:[7], label:"Rut"},
  {ids:[8,9], label:"Samuelbücher"}, {ids:[10,11], label:"Königsbücher"},
  {ids:[12,13], label:"Chronikbücher"}, {ids:[14], label:"Esra"},
  {ids:[15], label:"Nehemia"}, {ids:[16], label:"Ester"}, {ids:[17], label:"Hiob"},
  {ids:[18], label:"Psalmen"}, {ids:[19], label:"Sprüche"}, {ids:[20], label:"Prediger"},
  {ids:[21], label:"Hoheslied"}, {ids:[22], label:"Jesaja"}, {ids:[23], label:"Jeremia"},
  {ids:[24], label:"Klagelieder"}, {ids:[25], label:"Hesekiel"}, {ids:[26], label:"Daniel"},
  {ids:[27], label:"Hosea"}, {ids:[28], label:"Joel"}, {ids:[29], label:"Amos"},
  {ids:[30], label:"Obadja"}, {ids:[31], label:"Jona"}, {ids:[32], label:"Micha"},
  {ids:[33], label:"Nahum"}, {ids:[34], label:"Habakuk"}, {ids:[35], label:"Zefanja"},
  {ids:[36], label:"Haggai"}, {ids:[37], label:"Sacharja"}, {ids:[38], label:"Maleachi"},
  {ids:[39], label:"Matthäus"}, {ids:[40], label:"Markus"}, {ids:[41], label:"Lukas"},
  {ids:[42], label:"Johannes"}, {ids:[43], label:"Apostelgeschichte"}, {ids:[44], label:"Römer"},
  {ids:[45,46], label:"Korintherbriefe"}, {ids:[47], label:"Galater"}, {ids:[48], label:"Epheser"},
  {ids:[49], label:"Philipper"}, {ids:[50], label:"Kolosser"}, {ids:[51,52], label:"Thessalonicherbriefe"},
  {ids:[53,54], label:"Timotheusbriefe"}, {ids:[55], label:"Titus"}, {ids:[56], label:"Philemon"},
  {ids:[57], label:"Hebräer"}, {ids:[58], label:"Jakobus"}, {ids:[59,60], label:"Petrusbriefe"},
  {ids:[61,62,63], label:"Johannesbriefe"}, {ids:[64], label:"Judas"}, {ids:[65], label:"Offenbarung"}
];
FAMILIES.forEach(f => f.testament = f.ids[0] < 39 ? 'AT' : 'NT');
const AT_END = FAMILIES.map(f=>f.testament).lastIndexOf('AT');
const NT_START = AT_END + 1;

// Nur Kategorien mit mehreren Büchern — Apostelgeschichte/Offenbarung sind Einzelbücher und fliegen raus
const CATEGORIES = [
  {name:"Gesetz", start:0, end:4},
  {name:"Geschichtsbücher", start:5, end:16},
  {name:"Lehr- und Weisheitsbücher", start:17, end:21},
  {name:"Große Propheten", start:22, end:26},
  {name:"Kleine Propheten", start:27, end:38},
  {name:"Evangelien", start:39, end:42},
  {name:"Paulusbriefe", start:44, end:56},
  {name:"Allgemeine Briefe", start:57, end:64}
];
CATEGORIES.forEach(c => c.testament = c.start < 39 ? 'AT' : 'NT');
const CATEGORY_EXCLUDED = [43, 65]; // Apostelgeschichte, Offenbarung — keine Kategorie-Fragen dazu
function categoryOf(idx){ return CATEGORIES.find(c => idx>=c.start && idx<=c.end); }
function categoryMembers(cat){ const arr=[]; for(let i=cat.start;i<=cat.end;i++) arr.push(i); return arr; }

const TYPE_LABELS = {
  pair:'Reihenfolge', gap:'Lückentext', order:'Sortieren',
  catBool:'Kategorie (Ja/Nein)', catCount:'Kategorie · Anzahl',
  catOrder:'Kategorie · Reihenfolge', catSelect:'Kategorie · Auswahl',
  author:'Autor', history:'Biblische Geschichte', distance:'Abstand'
};
const TYPE_DESCRIPTIONS = {
  pair:'Zwei Bücher — welches kommt zuerst?',
  gap:'Fehlendes Buch in einer 3er-Reihe ergänzen.',
  order:'3–6 Bücher in die richtige Reihenfolge bringen.',
  catBool:'Ja/Nein: Gehört dieses Buch zu dieser Kategorie?',
  catCount:'Wie viele Bücher gehören zu einer Kategorie?',
  catOrder:'Welche Kategorie kommt in der Bibel zuerst?',
  catSelect:'Aus 5 Büchern die auswählen, die zur genannten Kategorie gehören.',
  author:'Wem wird ein Buch (traditionell) als Autor zugeschrieben?',
  history:'Ein Ereignis wird beschrieben — in welchem Buch steht es?',
  distance:'Wie viele Büchergruppen liegen zwischen zwei Büchern?'
};
const TYPE_WEIGHTS = { pair:2, gap:3, order:3, catBool:2, catCount:1, catOrder:1, catSelect:1, author:1, history:1, distance:1 };
const TYPE_KEYS = Object.keys(TYPE_LABELS);
let enabledTypes = { pair:true, gap:true, order:true, catBool:false, catCount:false, catOrder:false, catSelect:false, author:false, history:false, distance:false };

function loadTypeSettings(){
  try{
    const raw = localStorage.getItem('bibleQuizTypesEnabled');
    if(raw){
      const parsed = JSON.parse(raw);
      TYPE_KEYS.forEach(k => { if(typeof parsed[k] === 'boolean') enabledTypes[k] = parsed[k]; });
    }
  }catch(e){}
}
function saveTypeSettings(){
  try{ localStorage.setItem('bibleQuizTypesEnabled', JSON.stringify(enabledTypes)); }catch(e){}
}
function renderSettingsPanel(){
  const panel = document.getElementById('settingsPanel');
  panel.innerHTML = '';
  TYPE_KEYS.forEach(key=>{
    const row = document.createElement('div');
    row.className = 'settingsRow';
    const textCol = document.createElement('div');
    textCol.style.display = 'flex';
    textCol.style.flexDirection = 'column';
    textCol.style.gap = '2px';
    textCol.style.paddingRight = '10px';
    const label = document.createElement('span');
    label.textContent = TYPE_LABELS[key];
    const desc = document.createElement('span');
    desc.textContent = TYPE_DESCRIPTIONS[key] || '';
    desc.style.fontSize = '11.5px';
    desc.style.color = 'var(--ink-soft)';
    desc.style.fontFamily = 'var(--serif)';
    desc.style.fontStyle = 'italic';
    textCol.appendChild(label);
    textCol.appendChild(desc);
    const toggle = document.createElement('div');
    toggle.className = 'toggle' + (enabledTypes[key] ? ' on' : '');
    toggle.onclick = () => {
      const enabledCount = TYPE_KEYS.filter(k=>enabledTypes[k]).length;
      if(enabledTypes[key] && enabledCount <= 1) return;
      enabledTypes[key] = !enabledTypes[key];
      saveTypeSettings();
      renderSettingsPanel();
    };
    row.appendChild(textCol);
    row.appendChild(toggle);
    panel.appendChild(row);
  });
}
function buildBag(){
  let bag = [];
  TYPE_KEYS.forEach(t=>{ if(enabledTypes[t]){ for(let i=0;i<TYPE_WEIGHTS[t];i++) bag.push(t); } });
  if(bag.length === 0) bag = ['pair'];
  return bag;
}

let weights = new Array(N).fill(6);
let stats = {totalAnswered:0, totalCorrect:0, currentStreak:0, bestStreak:0, recentGreen:[]};
let current = null;
let answered = false;
let testMode = false, testIndex = 0, testScore = 0;
const TEST_LENGTH = 10;

const STORAGE_KEY_WEIGHTS = 'bibleQuizWeights';
const STORAGE_KEY_STATS = 'bibleQuizStats';
const STORAGE_KEY_HISTORY = 'bibleQuizHistory';
let historyProgress = {};

// Ab wann eine einzelne Geschichte in den schweren Modus wechselt.
const HISTORY_UNLOCK_CORRECT = 3;

function setStorageStatus(text){
  const el = document.getElementById('storageStatus');
  if(el) el.textContent = text;
}

function loadProgress(){
  try{
    const w = localStorage.getItem(STORAGE_KEY_WEIGHTS);
    const s = localStorage.getItem(STORAGE_KEY_STATS);
    if(w) weights = JSON.parse(w);
    if(s) stats = JSON.parse(s);
    if(!Array.isArray(stats.recentGreen)) stats.recentGreen = [];
    const h = localStorage.getItem(STORAGE_KEY_HISTORY);
    if(h) historyProgress = JSON.parse(h);
    setStorageStatus((w || s) ? 'Vorheriger Fortschritt geladen ✓' : 'Kein gespeicherter Fortschritt gefunden (erster Start auf diesem Gerät/Browser).');
  }catch(e){
    setStorageStatus('⚠️ Laden fehlgeschlagen: ' + (e && e.message ? e.message : String(e)));
  }
}

function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY_WEIGHTS, JSON.stringify(weights));
    localStorage.setItem(STORAGE_KEY_STATS, JSON.stringify(stats));
    localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(historyProgress));
    setStorageStatus('Gespeichert ✓ · ' + new Date().toLocaleTimeString());
  }catch(e){
    setStorageStatus('⚠️ Speichern fehlgeschlagen: ' + (e && e.message ? e.message : String(e)) + ' — bitte "Fortschritt exportieren" als Sicherung nutzen.');
  }
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function weightedIndex(weightArr, exclude){
  exclude = exclude || [];
  let total = 0;
  for(let i=0;i<weightArr.length;i++) if(!exclude.includes(i)) total += weightArr[i];
  let r = Math.random()*total;
  for(let i=0;i<weightArr.length;i++){
    if(exclude.includes(i)) continue;
    r -= weightArr[i];
    if(r < 0) return i;
  }
  for(let i = 0; i < weightArr.length; i++) if(!exclude.includes(i)) return i;
  return 0;
}
function familyWeight(f){ return f.ids.reduce((s,i)=>s+weights[i],0)/f.ids.length; }
function weightedFamilyIndex(){ return weightedIndex(FAMILIES.map(familyWeight)); }
function categoryWeight(c){ let s=0,n=0; for(let i=c.start;i<=c.end;i++){s+=weights[i];n++;} return s/n; }
function weightedCategoryIndex(){ return weightedIndex(CATEGORIES.map(categoryWeight)); }

function updateWeight(idx, correct){
  const before = weights[idx];
  weights[idx] = correct ? clamp(weights[idx]-2,1,20) : clamp(weights[idx]+5,1,20);
  return before > 2 && weights[idx] <= 2;
}
function _finishQuestion(overallCorrect, weightUpdates){
  const greenNow = [];
  weightUpdates.forEach(w => { if(updateWeight(w.idx, w.correct)) greenNow.push(w.idx); });
  stats.totalAnswered++;
  if(overallCorrect){
    stats.totalCorrect++;
    stats.currentStreak++;
    stats.bestStreak = Math.max(stats.bestStreak, stats.currentStreak);
  } else {
    stats.currentStreak = 0;
  }
  if(greenNow.length){
    stats.recentGreen = stats.recentGreen || [];
    greenNow.forEach(idx => {
      stats.recentGreen = [idx, ...stats.recentGreen.filter(i => i !== idx)].slice(0,3);
    });
  }
  if(testMode && overallCorrect) testScore++;
  saveProgress();
  renderShelf(weightUpdates.map(w=>w.idx));
  renderStats();
}
function registerResult(bookIndices, correct){
  _finishQuestion(correct, bookIndices.map(i=>({idx:i, correct})));
}

function renderShelf(pulseIndices){
  const shelfAT = document.getElementById('shelfAT');
  const shelfNT = document.getElementById('shelfNT');
  shelfAT.innerHTML = '';
  shelfNT.innerHTML = '';
  const categoryStarts = new Set([5,17,22,27,39,43,44,57,65]);
  for(let i=0;i<N;i++){
    const d = document.createElement('div');
    let cls = 'spine mid';
    if(weights[i] <= 2) cls = 'spine green';
    else if(weights[i] > 9) cls = 'spine red';
    if(categoryStarts.has(i)) cls += ' catStart';
    if(pulseIndices && pulseIndices.includes(i)) cls += ' pulse';
    d.className = cls;
    d.title = BOOKS[i];
    (i < 39 ? shelfAT : shelfNT).appendChild(d);
  }
  const mastered = weights.filter(w => w <= 2).length;
  document.getElementById('masteryLine').textContent = 'Sicher beherrscht: ' + mastered + ' / ' + N + ' Bücher';
  const recent = (stats.recentGreen || []).map(i => BOOKS[i]);
  document.getElementById('recentGreen').textContent = recent.length ? 'Zuletzt sicher: ' + recent.join(' · ') : '';
}
function renderStats(){
  document.getElementById('statLine').textContent =
    'Serie: ' + stats.currentStreak + ' · Rekord: ' + stats.bestStreak + ' · Richtig: ' + stats.totalCorrect + '/' + stats.totalAnswered;
}

// ---------- Fragen-Generatoren ----------

function genPair(){
  const a = weightedFamilyIndex();
  const isAT = FAMILIES[a].testament === 'AT';
  const lo = isAT ? 0 : NT_START;
  const hi = isAT ? AT_END : FAMILIES.length-1;
  let dist = 1 + Math.floor(Math.random()*6);
  let dir = Math.random()<0.5 ? -1 : 1;
  let b = a + dir*dist;
  if(b < lo || b > hi){ dir *= -1; b = a + dir*dist; }
  b = clamp(b, lo, hi);
  if(b === a) b = clamp(a + (a>lo ? -1 : 1), lo, hi);
  const order = Math.random()<0.5 ? [a,b] : [b,a];
  return { type:'pair', left: order[0], right: order[1] };
}

function genGap(){
  const center = weightedFamilyIndex();
  const len = FAMILIES.length;
  const desiredPos = Math.floor(Math.random()*3); // 0=Anfang, 1=Mitte, 2=Ende
  const start = clamp(center - desiredPos, 0, len-3);
  const windowIdx = [start, start+1, start+2];
  const blankPos = windowIdx.includes(center) ? windowIdx.indexOf(center) : desiredPos;
  const blankFam = windowIdx[blankPos];
  const twoBlanks = Math.random() < 0.35;
  let blankPositions = twoBlanks
    ? [blankPos, [0,1,2].filter(p => p !== blankPos)[Math.floor(Math.random()*2)]]
    : [blankPos];
  blankPositions = [...new Set(blankPositions)].sort((a,b)=>a-b);
  const blankFams = blankPositions.map(p => windowIdx[p]);
  let pool = [];
  for(let i=0;i<len;i++){
    if(windowIdx.includes(i)) continue;
    if(blankFams.some(f => Math.abs(i-f) <= 8)) pool.push(i);
  }
  if(pool.length < (twoBlanks ? 4 : 3)) for(let i=0;i<len;i++) if(!windowIdx.includes(i)) pool.push(i);
  pool = [...new Set(pool)];
  shuffleArr(pool);
  const distractors = pool.slice(0, twoBlanks ? 4 : 3);
  const options = shuffleArr([...blankFams, ...distractors]);
  return { type:'gap', windowIdx, blankPositions, blankFams, options, twoBlanks, inputMode: Math.random() < 0.30 };
}

function genOrder(){
  const base = weightedFamilyIndex();
  const count = Math.floor(Math.random() * 3) + 4;
  const span = 9;
  const len = FAMILIES.length;
  const isAT = FAMILIES[base].testament === 'AT';
  const rangeLo = isAT ? 0 : NT_START;
  const rangeHi = isAT ? AT_END : len-1;
  let lo = clamp(base-span, rangeLo, rangeHi);
  let hi = clamp(base+span, rangeLo, rangeHi);
  if(hi-lo+1 < count){ lo = rangeLo; hi = rangeHi; }
  let pool = [];
  for(let i=lo;i<=hi;i++) pool.push(i);
  const set = new Set([base]);
  let guard = 0;
  while(set.size < count && guard < 200){
    guard++;
    set.add(pool[Math.floor(Math.random()*pool.length)]);
  }
  const fams = [...set].sort((a,b)=>a-b);
  const shuffled = [...fams];
  for(let i=shuffled.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]];
  }
  return { type:'order', fams, shuffled, placed: [] };
}

// Variante: genau drei unmittelbar aufeinanderfolgende Bücher/Gruppen sortieren
function genOrderSeq(){
  const center = weightedFamilyIndex();
  const len = FAMILIES.length;
  const isAT = FAMILIES[center].testament === 'AT';
  const rangeLo = isAT ? 0 : NT_START;
  const rangeHi = isAT ? AT_END : len-1;
  let start = clamp(center-1, rangeLo, rangeHi-2);
  if(start < rangeLo) start = rangeLo;
  if(start+2 > rangeHi) start = rangeHi-2;
  const fams = [start, start+1, start+2];
  const shuffled = [...fams];
  for(let i=shuffled.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]];
  }
  return { type:'order', fams, shuffled, placed: [] };
}

function genCatBool(){
  const idx = weightedIndex(weights, CATEGORY_EXCLUDED);
  const trueCat = categoryOf(idx);
  const isTrue = Math.random() < 0.5;
  let statementCat = trueCat;
  if(!isTrue){
    const altPool = CATEGORIES.filter(c => c !== trueCat && c.testament === trueCat.testament);
    statementCat = altPool[Math.floor(Math.random()*altPool.length)];
  }
  return { type:'catBool', idx, statementCat, isTrue };
}

function genCatCount(){
  const catIdx = weightedCategoryIndex();
  const cat = CATEGORIES[catIdx];
  const correct = cat.end - cat.start + 1;
  const optionsSet = new Set([correct]);
  let guard = 0;
  while(optionsSet.size < 4 && guard < 50){
    guard++;
    const val = correct + (Math.floor(Math.random()*7) - 3);
    if(val >= 1) optionsSet.add(val);
  }
  const options = [...optionsSet];
  for(let i=options.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [options[i],options[j]] = [options[j],options[i]];
  }
  return { type:'catCount', cat, correct, options };
}

function genCatOrder(){
  const catIdx = weightedCategoryIndex();
  const sameTestament = CATEGORIES.map((c,i)=>i).filter(i => i!==catIdx && CATEGORIES[i].testament === CATEGORIES[catIdx].testament);
  const other = sameTestament[Math.floor(Math.random()*sameTestament.length)];
  const order = Math.random()<0.5 ? [catIdx, other] : [other, catIdx];
  return { type:'catOrder', left: order[0], right: order[1] };
}

function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function genAuthor(){
  const eligible = FAMILIES.map((f,i)=>i).filter(i => AUTHORS[i] !== null);
  const w = eligible.map(i => familyWeight(FAMILIES[i]));
  const famIdx = eligible[weightedIndex(w)];
  const correctAuthor = AUTHORS[famIdx];
  const testament = FAMILIES[famIdx].testament;
  const pool = [...new Set(eligible.filter(i => FAMILIES[i].testament === testament && AUTHORS[i] !== correctAuthor).map(i => AUTHORS[i]))];
  shuffleArr(pool);
  const options = shuffleArr([correctAuthor, ...pool.slice(0,2)]);
  return { type:'author', famIdx, correctAuthor, options };
}

function genHistory(){
  const weightForEvent = e => e.books ? e.books.reduce((s,i)=>s+weights[i],0)/e.books.length : weights[e.book];
  const w = EVENTS.map(weightForEvent);
  const evIdx = weightedIndex(w);
  const ev = EVENTS[evIdx];
  const multiBook = Array.isArray(ev.books) && ev.books.length > 1;
  const targetBook = multiBook ? null : (ev.book !== undefined ? ev.book : ev.books[0]);
  const progress = historyProgress[evIdx] || {bookCorrect:0,chapterCorrect:0,inputUnlocked:false};
  // Mehrfach-Evangelien bleiben bei der Mehrfachauswahl. Ereignisse mit genau
  // einem Buch können dagegen nach drei richtigen Zuordnungen schwer werden.
  if(multiBook){ return { type:'history', ev, selected:new Set(), evIdx, hard:false, multiBook:true }; }
  const hard = progress.bookCorrect >= HISTORY_UNLOCK_CORRECT;
  const testament = targetBook < 39 ? 'AT' : 'NT';
  const pool = [];
  for(let i=0;i<N;i++){ if(i===targetBook) continue; if((i<39?'AT':'NT')!==testament) continue; pool.push(i); }
  const nearPool = pool.filter(i=>Math.abs(i-targetBook)<=6);
  const usePool = nearPool.length>=3 ? nearPool : pool;
  shuffleArr(usePool);
  const options = shuffleArr([targetBook,...usePool.slice(0,3)]);
  return { type:'history', ev, options, evIdx, hard, chapterInput: progress.inputUnlocked || false, targetBook, multiBook:false };
}

function genCatSelect(){
  const catIdx = weightedCategoryIndex();
  const cat = CATEGORIES[catIdx];
  const members = categoryMembers(cat);
  const maxK = Math.min(5, members.length);
  const k = Math.floor(Math.random()*(maxK+1));
  const shuffledMembers = [...members];
  for(let i=shuffledMembers.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [shuffledMembers[i],shuffledMembers[j]] = [shuffledMembers[j],shuffledMembers[i]];
  }
  const chosenMembers = shuffledMembers.slice(0,k);
  const excluded = new Set([...members, ...CATEGORY_EXCLUDED]);
  const pool = [];
  for(let i=0;i<N;i++) if(!excluded.has(i)) pool.push(i);
  for(let i=pool.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  const distractors = pool.slice(0, 5-k);
  const candidates = [...chosenMembers.map(idx=>({idx, belongs:true})), ...distractors.map(idx=>({idx, belongs:false}))];
  for(let i=candidates.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [candidates[i],candidates[j]] = [candidates[j],candidates[i]];
  }
  return { type:'catSelect', cat, candidates, selected: new Set() };
}

function nextQuestion(){
  answered = false;
  const bag = buildBag();
  const t = bag[Math.floor(Math.random()*bag.length)];
  if(t === 'pair') current = genPair();
  else if(t === 'gap') current = genGap();
  else if(t === 'order') current = Math.random() < 0.5 ? genOrderSeq() : genOrder();
  else if(t === 'catBool') current = genCatBool();
  else if(t === 'catCount') current = genCatCount();
  else if(t === 'catOrder') current = genCatOrder();
  else if(t === 'catSelect') current = genCatSelect();
  else if(t === 'author') current = genAuthor();
  else if(t === 'distance') current = genDistance();
  else current = genHistory();
  render();
}
function advance(){
  if(testMode){
    testIndex++;
    if(testIndex >= TEST_LENGTH){ renderTestSummary(); return; }
  }
  nextQuestion();
}

// ---------- Rendering ----------

function testHeaderHtml(){
  if(!testMode) return '';
  return '<div class="testHeader">Kurztest · Frage ' + (testIndex+1) + '/' + TEST_LENGTH + ' · ' + testScore + ' richtig</div>';
}
function render(){
  const card = document.getElementById('card');
  card.innerHTML = testHeaderHtml();
  if(current.type === 'pair') renderPair(card);
  else if(current.type === 'gap') renderGap(card);
  else if(current.type === 'order') renderOrder(card);
  else if(current.type === 'catBool') renderCatBool(card);
  else if(current.type === 'catCount') renderCatCount(card);
  else if(current.type === 'catOrder') renderCatOrder(card);
  else if(current.type === 'catSelect') renderCatSelect(card);
  else if(current.type === 'author') renderAuthor(card);
  else if(current.type === 'distance') renderDistance(card);
  else renderHistory(card);
}

function renderPair(card){
  addLabel(card, 'Reihenfolge');
  addQ(card, 'Was kommt in der Bibel zuerst?');
  const fb = addFb(card);
  const row = document.createElement('div');
  row.className = 'pairRow';
  [current.left, current.right].forEach(fam=>{
    const el = document.createElement('div');
    el.className = 'opt';
    el.textContent = FAMILIES[fam].label;
    el.onclick = () => {
      if(answered) return;
      answered = true;
      const correctFam = Math.min(current.left, current.right);
      const wrongFam = Math.max(current.left, current.right);
      const isRight = fam === correctFam;
      el.classList.add(isRight ? 'correct' : 'wrong');
      row.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
      if(!isRight){ [...row.children].forEach(o=>{ if(o.textContent === FAMILIES[correctFam].label) o.classList.add('correct'); }); }
      fb.className = 'feedback ' + (isRight ? 'good' : 'bad');
      fb.textContent = (isRight ? 'Richtig — ' : 'Nicht ganz — ') + FAMILIES[correctFam].label + ' steht vor ' + FAMILIES[wrongFam].label + '.';
      registerResult(FAMILIES[current.left].ids.concat(FAMILIES[current.right].ids), isRight);
    };
    row.appendChild(el);
  });
  card.appendChild(row);
  card.appendChild(buildActionRow());
}

function renderGap(card){
  addLabel(card, current.inputMode ? 'Lückentext · Schwer' : 'Lückentext');
  addQ(card, current.twoBlanks ? 'Welche zwei Bücher fehlen in der Reihe?' : 'Was fehlt in der Reihe?');
  const fb = addFb(card);
  const seq = document.createElement('div');
  seq.className = 'seqLine';
  const blankSet = new Set(current.blankPositions);
  const parts = current.windowIdx.map((fam,pos)=>{
    if(blankSet.has(pos)) return '<span class="blank">?</span>';
    return '<span class="known">' + FAMILIES[fam].label + '</span>';
  });
  seq.innerHTML = parts.join(' — ');
  card.appendChild(seq);

  if(current.inputMode && !current.twoBlanks){
    const input = document.createElement('input');
    input.className = 'chapterInput';
    input.type = 'text';
    input.autocomplete = 'off';
    input.placeholder = 'Buch eingeben';
    const row = document.createElement('div'); row.className='actionRow';
    const check = document.createElement('button'); check.className='primary'; check.textContent='Prüfen';
    check.onclick = () => {
      if(answered) return;
      const answer = input.value.trim().toLowerCase();
      const correctLabel = FAMILIES[current.blankFams[0]].label.toLowerCase();
      const aliases = FAMILIES[current.blankFams[0]].ids.map(i=>BOOKS[i].toLowerCase());
      const isRight = answer === correctLabel || aliases.includes(answer);
      answered = true; input.disabled=true; check.disabled=true;
      seq.innerHTML = current.windowIdx.map((fam,pos)=> blankSet.has(pos) ? '<span class="known">'+FAMILIES[fam].label+'</span>' : '<span class="known">'+FAMILIES[fam].label+'</span>').join(' — ');
      fb.className='feedback '+(isRight?'good':'bad');
      fb.textContent=isRight?'Richtig!':'Es ist '+FAMILIES[current.blankFams[0]].label+'.';
      registerResult(FAMILIES[current.blankFams[0]].ids,isRight);
      row.innerHTML=''; row.appendChild(buildNextButton());
    };
    card.appendChild(input); card.appendChild(row);
    input.focus();
    return;
  }

  const opts = document.createElement('div'); opts.className='options';
  if(current.twoBlanks){
    const selected = new Set();
    current.options.forEach(fam=>{
      const el=document.createElement('div'); el.className='opt'; el.textContent=FAMILIES[fam].label;
      el.onclick=()=>{
        if(answered) return;
        if(selected.has(fam)){ selected.delete(fam); el.classList.remove('correct'); }
        else { selected.add(fam); el.classList.add('correct'); }
      };
      opts.appendChild(el);
    });
    card.appendChild(opts);
    const row=document.createElement('div'); row.className='actionRow';
    const check=document.createElement('button'); check.className='primary'; check.textContent='Prüfen';
    check.onclick=()=>{
      if(answered) return; answered=true;
      const truth=new Set(current.blankFams);
      const isRight=selected.size===truth.size && [...truth].every(f=>selected.has(f));
      [...opts.children].forEach((el,i)=>{ const fam=current.options[i]; el.classList.remove('correct'); if(truth.has(fam)) el.classList.add('correct'); if(!truth.has(fam)&&selected.has(fam)) el.classList.add('wrong'); el.classList.add('disabled'); });
      fb.className='feedback '+(isRight?'good':'bad');
      fb.textContent=isRight?'Richtig!':'Es fehlen: '+current.blankFams.map(f=>FAMILIES[f].label).join(' und ')+'.';
      _finishQuestion(isRight,current.options.map(f=>({idx:f,correct:selected.has(f)===truth.has(f)})));
      row.innerHTML=''; row.appendChild(buildNextButton());
    };
    row.appendChild(check); card.appendChild(row);
  } else {
    current.options.forEach(fam=>{
      const el=document.createElement('div'); el.className='opt'; el.textContent=FAMILIES[fam].label;
      el.onclick=()=>{
        if(answered) return; answered=true;
        const isRight=fam===current.blankFams[0];
        el.classList.add(isRight?'correct':'wrong'); opts.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
        if(!isRight) [...opts.children].forEach(o=>{if(o.textContent===FAMILIES[current.blankFams[0]].label)o.classList.add('correct');});
        seq.innerHTML=current.windowIdx.map((f,pos)=>blankSet.has(pos)?'<span class="known">'+FAMILIES[f].label+'</span>':'<span class="known">'+FAMILIES[f].label+'</span>').join(' — ');
        fb.className='feedback '+(isRight?'good':'bad'); fb.textContent=isRight?'Richtig!':'Es ist '+FAMILIES[current.blankFams[0]].label+'.';
        registerResult(FAMILIES[current.blankFams[0]].ids,isRight);
      }; opts.appendChild(el);
    });
    card.appendChild(opts); card.appendChild(buildActionRow());
  }
}

function renderOrder(card){
  addLabel(card, 'Sortieren');
  addQ(card, 'Tippe in der richtigen biblischen Reihenfolge an.');
  const fb = addFb(card);
  const slots = document.createElement('div');
  slots.className = 'answerSlots';
  card.appendChild(slots);
  const chips = document.createElement('div');
  chips.className = 'chipsRow';
  current.shuffled.forEach(fam=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = FAMILIES[fam].label;
    chip.onclick = () => {
      if(answered || current.placed.includes(fam)) return;
      current.placed.push(fam);
      chip.classList.add('used');
      renderSlots(slots);
      if(current.placed.length === current.fams.length) checkOrder(fb);
    };
    chips.appendChild(chip);
  });
  card.appendChild(chips);
  const resetSel = document.createElement('button');
  resetSel.className = 'ghost';
  resetSel.textContent = 'Auswahl zurücksetzen';
  resetSel.style.marginBottom = '10px';
  resetSel.onclick = () => {
    if(answered) return;
    current.placed = [];
    chips.querySelectorAll('.chip').forEach(c=>c.classList.remove('used'));
    renderSlots(slots);
  };
  card.appendChild(resetSel);
  renderSlots(slots);
  card.appendChild(buildActionRow());
}
function renderSlots(slots){
  slots.innerHTML = '';
  current.placed.forEach((fam,pos)=>{
    const s = document.createElement('div');
    s.className = 'slot';
    s.innerHTML = '<span class="n">' + (pos+1) + '</span><span>' + FAMILIES[fam].label + '</span>';
    slots.appendChild(s);
  });
}
function checkOrder(fb){
  answered = true;
  const sortedCorrect = [...current.fams].sort((a,b)=>a-b);
  const isRight = current.placed.every((v,i)=>v===sortedCorrect[i]);
  const slots = document.querySelectorAll('.slot');
  current.placed.forEach((fam,i)=>{ slots[i].classList.add(fam === sortedCorrect[i] ? 'correct' : 'wrong'); });
  fb.className = 'feedback ' + (isRight ? 'good' : 'bad');
  fb.textContent = isRight ? 'Richtig sortiert!' : 'Richtige Reihenfolge: ' + sortedCorrect.map(f=>FAMILIES[f].label).join(' — ');
  const allIds = [];
  current.fams.forEach(f => allIds.push(...FAMILIES[f].ids));
  registerResult(allIds, isRight);
}

    if(answered) return;
    answered = true;
    const perItem = current.candidates.map(c => ({ idx:c.idx, correct: current.selected.has(c.idx) === c.belongs }));
    const overallCorrect = perItem.every(p=>p.correct);
    [...chips.children].forEach((chipEl,i)=>{
      const c = current.candidates[i];

function renderAuthor(card){
  addLabel(card, 'Autor');
  addQ(card, 'Wem wird ' + FAMILIES[current.famIdx].label + ' (traditionell) zugeschrieben?');
  const fb = addFb(card);
  const opts = document.createElement('div');
  opts.className = 'options';
  current.options.forEach(author=>{
    const el = document.createElement('div');
    el.className = 'opt';
    el.textContent = author;
    el.onclick = () => {
      if(answered) return;
      answered = true;
      const isRight = author === current.correctAuthor;
      el.classList.add(isRight ? 'correct' : 'wrong');
      opts.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
      if(!isRight){ [...opts.children].forEach(o=>{ if(o.textContent === current.correctAuthor) o.classList.add('correct'); }); }
      fb.className = 'feedback ' + (isRight ? 'good' : 'bad');
      fb.textContent = isRight ? 'Richtig!' : ('Traditionell zugeschrieben wird es ' + current.correctAuthor + '.');
      registerResult(FAMILIES[current.famIdx].ids, isRight);
    };
    opts.appendChild(el);
  });
  card.appendChild(opts);
  card.appendChild(buildActionRow());
}

function renderDistance(card){
  addLabel(card,'Abstand');
  addQ(card,'Wie viele Büchergruppen liegen zwischen ' + FAMILIES[current.a].label + ' und ' + FAMILIES[current.b].label + '?');
  const fb=addFb(card); const opts=document.createElement('div'); opts.className='options';
  current.options.forEach(v=>{
    const el=document.createElement('div'); el.className='opt'; el.textContent=String(v);
    el.onclick=()=>{ if(answered)return; answered=true; const isRight=v===current.correct; el.classList.add(isRight?'correct':'wrong'); opts.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled')); if(!isRight)[...opts.children].forEach(o=>{if(Number(o.textContent)===current.correct)o.classList.add('correct');}); fb.className='feedback '+(isRight?'good':'bad'); fb.textContent=isRight?'Richtig!':'Es liegen '+current.correct+' Büchergruppen dazwischen.'; registerResult(FAMILIES[current.a].ids.concat(FAMILIES[current.b].ids),isRight); };
    opts.appendChild(el);
  });
  card.appendChild(opts); card.appendChild(buildActionRow());
}

function renderHistory(card){
  addLabel(card, current.hard ? 'Biblische Geschichte · Schwer' : 'Biblische Geschichte');
  addQ(card, current.ev.text);
  const instr = document.createElement('div');
  instr.style.fontSize='13px'; instr.style.color='var(--ink-soft)'; instr.style.marginBottom='14px'; instr.style.marginTop='-10px';
  card.appendChild(instr);

  if(current.multiBook){
    instr.textContent='In welchen Evangelien wird dies beschrieben?';
    renderHistoryMulti(card); return;
  }

  if(!current.hard){
    instr.textContent='In welchem Buch geschieht das?';
    renderHistoryBookChoice(card);
    return;
  }

  instr.textContent='In welchem Buch und in welchem Kapitel geschieht das?';
  renderHistoryHard(card);
}

function recordHistoryBookResult(evIdx, correct){
  const p=historyProgress[evIdx] || {bookCorrect:0,chapterCorrect:0,inputUnlocked:false};
  if(correct) p.bookCorrect++;
  historyProgress[evIdx]=p;
}
function renderHistoryBookChoice(card){
  const fb=addFb(card); const opts=document.createElement('div'); opts.className='options';
  current.options.forEach(bookIdx=>{
    const el=document.createElement('div'); el.className='opt'; el.textContent=BOOKS[bookIdx];
    el.onclick=()=>{ if(answered)return; answered=true; const isRight=bookIdx===current.targetBook; el.classList.add(isRight?'correct':'wrong'); opts.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled')); if(!isRight)[...opts.children].forEach(o=>{if(o.textContent===BOOKS[current.targetBook])o.classList.add('correct');}); fb.className='feedback '+(isRight?'good':'bad'); fb.textContent=isRight?'Richtig!':'Das steht in '+BOOKS[current.targetBook]+'.'; recordHistoryBookResult(current.evIdx,isRight); registerResult([current.targetBook],isRight); saveProgress(); };
    opts.appendChild(el);
  });
  card.appendChild(opts); card.appendChild(buildActionRow());
}
function chapterOptions(correct){
  const vals=new Set([correct]);
  while(vals.size<4){ const delta=Math.floor(Math.random()*7)-3; const v=Math.max(1,correct+delta); vals.add(v); }
  return shuffleArr([...vals]);
}
function finishHistoryHard(isRight, fb, extraFinish){
  const p=historyProgress[current.evIdx] || {bookCorrect:3,chapterCorrect:0,inputUnlocked:false};
  if(isRight) p.chapterCorrect++; else p.chapterCorrect=0;
  if(p.chapterCorrect>=2) p.inputUnlocked=true;
  historyProgress[current.evIdx]=p;
  extraFinish();
  saveProgress();
}
function renderHistoryHard(card){
  const fb=addFb(card);
  const bookBox=document.createElement('div'); bookBox.className='options';
  current.options.forEach(bookIdx=>{
    const el=document.createElement('div'); el.className='opt'; el.textContent=BOOKS[bookIdx];
    el.onclick=()=>{
      if(answered)return;
      const isBookRight=bookIdx===current.targetBook;
      if(!isBookRight){ answered=true; el.classList.add('wrong'); bookBox.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled')); [...bookBox.children].forEach(o=>{if(o.textContent===BOOKS[current.targetBook])o.classList.add('correct');}); fb.className='feedback bad'; fb.textContent='Das steht in '+BOOKS[current.targetBook]+'.'; finishHistoryHard(false,fb,()=>registerResult([current.targetBook],false)); return; }
      bookBox.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled')); el.classList.add('correct');
      renderHistoryChapter(card, fb);
    };
    bookBox.appendChild(el);
  });
  card.appendChild(bookBox);
}
function renderHistoryChapter(card, fb){
  const chapter = current.ev.chapter;
  const label=document.createElement('div'); label.className='chapterHint'; label.textContent='Kapitel wählen'; card.appendChild(label);
  const useInput=current.chapterInput;
  if(useInput){
    const input=document.createElement('input'); input.className='chapterInput'; input.type='number'; input.min='1'; input.max='200'; input.placeholder='Kapitel';
    const row=document.createElement('div'); row.className='actionRow'; const check=document.createElement('button'); check.className='primary'; check.textContent='Prüfen';
    check.onclick=()=>{ if(answered)return; answered=true; const isRight=Number(input.value)===chapter; input.disabled=true; check.disabled=true; fb.className='feedback '+(isRight?'good':'bad'); fb.textContent=isRight?'Richtig!':'Es ist Kapitel '+chapter+'.'; finishHistoryHard(isRight,fb,()=>registerResult([current.targetBook],isRight)); row.innerHTML=''; row.appendChild(buildNextButton()); };
    card.appendChild(input); card.appendChild(row); input.focus();
  } else {
    const opts=document.createElement('div'); opts.className='options'; chapterOptions(chapter).forEach(v=>{ const el=document.createElement('div'); el.className='opt'; el.textContent='Kapitel '+v; el.onclick=()=>{ if(answered)return; answered=true; const isRight=v===chapter; el.classList.add(isRight?'correct':'wrong'); opts.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled')); if(!isRight)[...opts.children].forEach(o=>{if(o.textContent==='Kapitel '+chapter)o.classList.add('correct');}); fb.className='feedback '+(isRight?'good':'bad'); fb.textContent=isRight?'Richtig!':'Es ist Kapitel '+chapter+'.'; finishHistoryHard(isRight,fb,()=>registerResult([current.targetBook],isRight)); }; opts.appendChild(el); });
    card.appendChild(opts);
  }
}

function renderHistoryMulti(card){
  const fb = addFb(card);
  const gospelIdx = [39, 40, 41, 42];
  const truthSet = new Set(current.ev.books);
  const chips = document.createElement('div');
  chips.className = 'chipsRow';
  gospelIdx.forEach(idx=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = BOOKS[idx];
    chip.onclick = () => {
      if(answered) return;
      if(current.selected.has(idx)){
        current.selected.delete(idx);
        chip.style.background = ''; chip.style.borderColor = '';
      } else {
        current.selected.add(idx);
        chip.style.background = 'var(--gold-soft)'; chip.style.borderColor = 'var(--gold)';
      }
    };
    chips.appendChild(chip);
  });
  card.appendChild(chips);
  const row = document.createElement('div');
  row.className = 'actionRow';
  const checkBtn = document.createElement('button');
  checkBtn.className = 'primary';
  checkBtn.textContent = 'Prüfen';
  checkBtn.onclick = () => {
    if(answered) return;
    answered = true;
    const perItem = gospelIdx.map(idx => ({ idx, correct: current.selected.has(idx) === truthSet.has(idx) }));
    const overallCorrect = perItem.every(p=>p.correct);
    [...chips.children].forEach((chipEl,i)=>{
      const idx = gospelIdx[i];
      const belongs = truthSet.has(idx);
      const wasSelected = current.selected.has(idx);
      chipEl.style.pointerEvents = 'none';
      if(belongs){
        chipEl.style.borderColor = 'var(--green)';
        chipEl.style.background = wasSelected ? 'var(--green-soft)' : '#fff';
      } else {
        if(wasSelected){ chipEl.style.borderColor = 'var(--red)'; chipEl.style.background = 'var(--red-soft)'; }
        else { chipEl.style.borderColor = 'var(--rule)'; chipEl.style.background = ''; }
      }
    });
    fb.className = 'feedback ' + (overallCorrect ? 'good' : 'bad');
    fb.textContent = overallCorrect ? 'Richtig!' : ('Erwähnt wird es bei: ' + current.ev.books.map(i=>BOOKS[i]).join(', ') + '.');
    _finishQuestion(overallCorrect, perItem);
    row.innerHTML = '';
    row.appendChild(buildNextButton());
  };
  row.appendChild(checkBtn);
  card.appendChild(row);
}

function renderTestSummary(){
  const card = document.getElementById('card');
  card.innerHTML = '';
  addLabel(card, 'Kurztest beendet');
  const score = document.createElement('div');
  score.className = 'summaryScore';
  score.textContent = testScore + ' / ' + TEST_LENGTH;
  card.appendChild(score);
  const line = document.createElement('div');
  line.className = 'summaryLine';
  const pct = Math.round((testScore/TEST_LENGTH)*100);
  line.textContent = pct >= 80 ? 'Sehr gut!' : (pct >= 50 ? 'Solide — weiter üben lohnt sich.' : 'Diese Bücher brauchen noch etwas Übung.');
  card.appendChild(line);
  const back = document.createElement('button');
  back.className = 'primary';
  back.textContent = 'Zurück zum Übungsmodus';
  back.onclick = () => { testMode = false; nextQuestion(); };
  card.appendChild(back);
}

document.getElementById('settingsBtn').onclick = () => {
  const panel = document.getElementById('settingsPanel');
  const showing = panel.style.display !== 'none';
  panel.style.display = showing ? 'none' : 'block';
  if(!showing) renderSettingsPanel();
};
document.getElementById('testBtn').onclick = () => {
  testMode = true; testIndex = 0; testScore = 0;
  nextQuestion();
};
document.getElementById('resetBtn').onclick = async () => {
  if(!confirm('Deinen gesamten Fortschritt wirklich zurücksetzen?')) return;
  weights = new Array(N).fill(6);
  stats = {totalAnswered:0, totalCorrect:0, currentStreak:0, bestStreak:0, recentGreen:[]};
  historyProgress = {};
  localStorage.removeItem(STORAGE_KEY_HISTORY);
  testMode = false;
  await saveProgress();
  renderShelf();
  renderStats();
  nextQuestion();
};

(async function init(){
  loadTypeSettings();
  await loadProgress();
  renderShelf();
  renderStats();
  nextQuestion();
})();
</script>
